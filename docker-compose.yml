name: thewine

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thewine-web
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_HOST: thewine-db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-thewine}
      DATABASE_USER: ${MYSQL_USER:-thewine}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET must be set}
      NOTIFICATION_JOB_SECRET: ${NOTIFICATION_JOB_SECRET:?NOTIFICATION_JOB_SECRET must be set}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://thewineexperience.com.br}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      # Router - suporteide.digital
      - "traefik.http.routers.thewine-router.rule=Host(`thewine.suporteide.digital`)"
      - "traefik.http.routers.thewine-router.entrypoints=websecure"
      - "traefik.http.routers.thewine-router.tls=true"
      - "traefik.http.routers.thewine-router.tls.certresolver=letsencrypt"
      - "traefik.http.routers.thewine-router.service=thewine-service"
      # Router - thewineexperience.com.br
      - "traefik.http.routers.thewine-oficial.rule=Host(`thewineexperience.com.br`)"
      - "traefik.http.routers.thewine-oficial.entrypoints=websecure"
      - "traefik.http.routers.thewine-oficial.tls=true"
      - "traefik.http.routers.thewine-oficial.tls.certresolver=letsencrypt"
      - "traefik.http.routers.thewine-oficial.service=thewine-service"
      # Router - www.thewineexperience.com.br
      - "traefik.http.routers.thewine-oficial-www.rule=Host(`www.thewineexperience.com.br`)"
      - "traefik.http.routers.thewine-oficial-www.entrypoints=websecure"
      - "traefik.http.routers.thewine-oficial-www.tls=true"
      - "traefik.http.routers.thewine-oficial-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.thewine-oficial-www.service=thewine-service"
      # Servico compartilhado
      - "traefik.http.services.thewine-service.loadbalancer.server.port=3000"

  db:
    image: mysql:8.0
    container_name: thewine-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-thewine}
      MYSQL_USER: ${MYSQL_USER:-thewine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - thewine_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: thewine-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_HOST: thewine-db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-thewine}
      DATABASE_USER: ${MYSQL_USER:-thewine}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      DATABASE_ADMIN_USER: root
      DATABASE_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command: ["node", "/app/next-app/scripts/migrate-local.mjs"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

networks:
  proxy:
    external: true

volumes:
  thewine_mysql_data:
