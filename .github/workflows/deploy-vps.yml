name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-thewine
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT || 'SHA256:8t59KrIspxmOiPKsLydWUMDMVnrJ/NKRSio5dpEDovE' }}
        run: |
          set -euo pipefail
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/thewine_known_hosts"
          MATCHED_HOSTS_FILE="$RUNNER_TEMP/thewine_matched_known_hosts"
          : > "$MATCHED_HOSTS_FILE"
          for KEY_TYPE in rsa ecdsa ed25519; do
            CANDIDATE_FILE="$RUNNER_TEMP/thewine_${KEY_TYPE}_known_hosts"
            ssh-keyscan -p "$VPS_PORT" -t "$KEY_TYPE" "$VPS_HOST" > "$CANDIDATE_FILE" 2>/dev/null || true
            if [ -s "$CANDIDATE_FILE" ] \
              && ssh-keygen -lf "$CANDIDATE_FILE" -E sha256 | awk '{print $2}' | grep -Fxq "$VPS_SSH_FINGERPRINT"; then
              cat "$CANDIDATE_FILE" >> "$MATCHED_HOSTS_FILE"
            fi
          done
          if [ ! -s "$MATCHED_HOSTS_FILE" ]; then
            echo "ABORTAR: fingerprint SSH da VPS não corresponde ao esperado." >&2
            exit 98
          fi
          cp "$MATCHED_HOSTS_FILE" "$KNOWN_HOSTS_FILE"
          cp "$KNOWN_HOSTS_FILE" ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<< "$VPS_SSH_KEY"
          
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER"@"$VPS_HOST" <<'REMOTE'
          set -e
          
          PROJECT_DIR="/opt/thewine-site/app"
          
          RESOLVED_DIR=$(realpath "$PROJECT_DIR")
          if [ "$RESOLVED_DIR" = "/" ] || [ "$RESOLVED_DIR" = "/opt" ] || [ "$RESOLVED_DIR" = "/var" ] || [ "$RESOLVED_DIR" = "/home" ] || [ "$RESOLVED_DIR" = "/root" ] || [ -z "$RESOLVED_DIR" ]; then
            echo "ABORTAR: Diretório inválido!" >&2
            exit 99
          fi
          
          cd "$RESOLVED_DIR"
          
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          
          docker compose config >/dev/null
          docker compose up -d --build --remove-orphans
          MIGRATION_STATUS=$(docker inspect -f '{{.State.ExitCode}}' thewine-migrate)
          if [ "$MIGRATION_STATUS" != "0" ]; then
            echo "ABORTAR: migrations do The Wine falharam (exit code $MIGRATION_STATUS)." >&2
            docker compose logs --no-color --tail=100 migrate >&2 || true
            exit 97
          fi
          docker compose ps
          
          REMOTE
